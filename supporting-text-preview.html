<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plainly Medicine — Supporting Text Contrast Preview</title>
<style>
  :root { --paper:#F7F3EA; --ink:#14110D; --c:#A32A31; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:system-ui,-apple-system,sans-serif; padding:40px; }
  h1 { font-family:Georgia,serif; font-size:42px; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .panel { background:var(--c); color:#FFF6E8; padding:36px; min-height:310px;
           border:2px solid var(--ink); }
  .label { font:500 11px/1.4 ui-monospace,monospace; letter-spacing:.22em;
           text-transform:uppercase; margin-bottom:18px; }
  h2 { font-family:Georgia,serif; font-size:48px; line-height:.94; margin:0 0 18px; }
  p { max-width:36ch; font-size:17px; line-height:1.6; opacity:.9; }
  figcaption { font:500 11px/1.4 ui-monospace,monospace; letter-spacing:.16em;
               text-transform:uppercase; text-align:center; margin-top:32px; }
  .current .label { opacity:.75; }
  .current figcaption { opacity:.55; }
  .proposed .label { opacity:.88; }
  .proposed figcaption { opacity:.70; }
  .tag { display:inline-block; background:var(--paper); color:var(--ink);
         font:600 11px ui-monospace,monospace; padding:6px 9px; margin-bottom:16px; }
  @media(max-width:750px){ .grid{grid-template-columns:1fr;} body{padding:18px;} }
</style>
</head>
<body>
<h1>Supporting text contrast</h1>
<div class="grid">
  <section>
    <div class="tag">Current</div>
    <div class="panel current">
      <div class="label">03 · Cardiology</div>
      <h2>The Slowest Emergency</h2>
      <p>Atherosclerosis is damage that adds up over decades.</p>
      <figcaption>The heart</figcaption>
    </div>
  </section>
  <section>
    <div class="tag">Proposed</div>
    <div class="panel proposed">
      <div class="label">03 · Cardiology</div>
      <h2>The Slowest Emergency</h2>
      <p>Atherosclerosis is damage that adds up over decades.</p>
      <figcaption>The heart</figcaption>
    </div>
  </section>
</div>
</body>
</html>
