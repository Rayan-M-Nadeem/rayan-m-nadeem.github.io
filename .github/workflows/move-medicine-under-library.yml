name: Move Plainly Medicine under library

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current Medicine site under /medicine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p medicine
          files=(
            index.html cardiology.html criticalcare.html editing.html exposure.html
            infectious.html longevity.html metabolic.html neurology.html oncology.html
            resistance.html transplant.html supporting-text-preview.html
            app.js figures.js glossary.js settings-extra.js settings-extra.css styles.css
            share-card.png og-image.png
          )
          for f in "${files[@]}"; do
            cp "$f" "medicine/$f"
          done

          # Keep all Medicine canonical/social URLs on the same domain and under /medicine/.
          find medicine -type f -name '*.html' -print0 | xargs -0 sed -i 's#https://rayan-m-nadeem.github.io/#https://plainlylibrary.com/medicine/#g'

          # Add a path back to the Plainly Library hub in the Medicine navigation.
          find medicine -type f -name '*.html' -print0 | xargs -0 sed -i 's#<a href="index.html#about">About</a>#<a href="index.html#about">About</a>\n        <a href="/">Plainly Library</a>#g'

          rm -f .github/workflows/move-medicine-under-library.yml

      - name: Commit Medicine subpath
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Move Plainly Medicine under /medicine'
          git push
